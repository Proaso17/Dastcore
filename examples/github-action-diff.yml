# Example GitHub Actions workflow: run dastcore against a preview/staging deploy on every
# pull request, diff the result against a committed baseline, and post the NEW findings back
# as a PR comment. The job fails ONLY on new regressions (via `dastcore diff --fail-on`),
# so preexisting debt in the baseline never blocks a PR.
#
# Copy to .github/workflows/dastcore-diff.yml and adjust PREVIEW_URL / the baseline path.
# Keep a baseline at .dastcore/baseline.json (produce it once with:
#   dastcore scan "$PREVIEW_URL" --i-have-authorization --profile full -f json -o .dastcore/baseline.json
# ) and refresh it deliberately when you accept new debt. Only point this at an
# environment you are authorized to test.
name: dastcore DAST diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # required to post the diff comment

jobs:
  dast-diff:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://preview.example.com
      BASELINE: .dastcore/baseline.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dastcore
        run: |
          python -m pip install --upgrade pip
          pip install ".[headless,oast]"
          python -m playwright install --with-deps chromium

      - name: Scan the preview deploy
        run: |
          dastcore scan "$PREVIEW_URL" \
            --i-have-authorization \
            --profile full \
            --format json \
            --output current.json \
            --fail-on none

      - name: Diff against the baseline (Markdown for the PR comment)
        id: diff
        run: |
          # Emits the PR-comment Markdown; exits 2 only if a NEW finding is >= high.
          dastcore diff "$BASELINE" current.json \
            --format markdown \
            --output diff.md \
            --fail-on high || echo "regression=1" >> "$GITHUB_OUTPUT"

      - name: Post the diff as a PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail the job on a new regression
        if: steps.diff.outputs.regression == '1'
        run: |
          echo "::error::dastcore found NEW findings at or above the failure threshold."
          exit 1
