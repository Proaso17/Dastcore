id: host-header-injection
name: Host Header Injection
family: host_header
severity: medium
cwe: CWE-644
owasp: WSTG-INPV-17
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
inject_into: [header]
payloads:
  - "dastcore-host-probe.invalid"
oracle:
  type: any_of
  checks:
    - type: reflected
confirm_reproducible: true
remediation: >-
  Do not build URLs, password-reset links or cache keys from the Host header.
  Validate it against an allowlist of expected hostnames, or generate links from a
  canonical base URL configured on the server.
