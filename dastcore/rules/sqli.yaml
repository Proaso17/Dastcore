id: sqli-injection
name: SQL Injection
family: sqli
severity: high
cwe: CWE-89
owasp: WSTG-INPV-05
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
inject_into: [query, body, json, path]
payloads:
  - "'"
  - "1' OR '1'='1"
oracle:
  type: any_of
  checks:
    - type: response_match
      part: body
      patterns:
        - "SQL syntax"
        - "SQLite3::error"
        - "sqlite3\\.OperationalError"
        - "ORA-\\d{5}"
        - "mysql_fetch"
        - "PostgreSQL.{0,20}ERROR"
        - "unrecognized token"
        # ORM / HQL injection (Hibernate, NHibernate, JPA/JPQL). These are exception *class names*
        # from the object-query layer — they only appear in a real server-side parse error when our
        # payload broke the HQL/JPQL query, never as a benign reflection of the input.
        - "org\\.hibernate\\.(?:QueryException|hql|exception\\.SQLGrammarException|QueryParameterException)"
        - "QuerySyntaxException"
        - "NHibernate\\.(?:Hql|QueryException|Exceptions)"
        - "(?:javax|jakarta)\\.persistence\\.\\w*(?:Exception|Query)"
    - type: time_based
      payload: "1) OR SLEEP({{delay}})-- -"
      delay: 3
      threshold_ms: 2500
confirm_reproducible: true
remediation: >-
  Use parameterized queries / prepared statements for every database call.
  Never build SQL by interpolating user input into a query string.
