id: ssrf-oob
name: Server-Side Request Forgery (blind, OAST-confirmed)
family: ssrf
severity: high
cwe: CWE-918
owasp: WSTG-INPV-19
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
inject_into: [query, body, json]
payloads:
  - "{{oast_url}}"
  - "http://{{oast_domain}}/"
  # Scheme / parser-confusion variants. All OAST-gated: the finding only fires if the collaborator
  # receives the callback, i.e. the server truly fetched our host, so any variant is zero-FP —
  # worst case it simply doesn't call back. They slip past filters that only block a given scheme.
  - "https://{{oast_domain}}/" # some filters only blocklist http://
  - "//{{oast_domain}}/" # scheme-relative: bypasses scheme allowlists
  - "http://foo@{{oast_domain}}/" # userinfo: the fetched host is still the collaborator
oracle:
  type: any_of
  checks:
    - type: oob
confirm_reproducible: false
remediation: >-
  Do not fetch user-supplied URLs. Validate against a strict allowlist of hosts
  and schemes, resolve and pin the destination, and block requests to internal
  ranges and cloud metadata endpoints (169.254.169.254).
