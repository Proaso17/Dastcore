id: open-redirect
name: Open Redirect
family: open_redirect
severity: medium
cwe: CWE-601
owasp: WSTG-CLNT-04
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:N/A:N"
inject_into: [query]
payloads:
  - "https://dastcore-redirect-probe.invalid/"
  - "//dastcore-redirect-probe.invalid/" # protocol-relative: bypasses naive "http"/"https" blocks
  # Parser-confusion variants (Orange Tsai "A New Era of SSRF" style). The open_redirect oracle
  # still requires the *resolved target host* to be our probe, so each of these only fires if the
  # server actually redirects there — zero new false positives, just more filters bypassed.
  - "/\\dastcore-redirect-probe.invalid/" # backslash authority: browsers read \ as /, naive same-origin filters see a path
  - "https://trusted.example@dastcore-redirect-probe.invalid/" # userinfo: real host is the probe; the "trusted" label is only userinfo
  - "https://dastcore-redirect-probe.invalid\\@trusted.example/" # backslash+userinfo: browser navigates to the probe, filter reads trusted.example
  # IDN / Unicode label-separator bypass: browsers fold these Unicode "full stop" chars to '.', so the
  # host still resolves to the probe, but a filter validating the host as an ASCII string won't match.
  - "//dastcore-redirect-probe．invalid/" # U+FF0E FULLWIDTH FULL STOP
  - "https://dastcore-redirect-probe｡invalid/" # U+FF61 HALFWIDTH IDEOGRAPHIC FULL STOP
oracle:
  type: any_of
  checks:
    # Confirms the redirect *target host* is our probe (not the probe merely appearing in a
    # same-origin Location query param), so a reflected-but-safe redirect isn't flagged.
    - type: open_redirect
confirm_reproducible: true
remediation: >-
  Never redirect to a raw user-controlled URL. Validate the destination
  against an allowlist of known-safe paths/hosts, or use an indirect
  lookup (e.g. a short id mapped server-side to the real target).
