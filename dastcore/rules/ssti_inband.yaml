id: ssti-inband
name: Server-Side Template Injection (in-band)
family: ssti
severity: high
cwe: CWE-1336
owasp: WSTG-INPV-18
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
inject_into: [query, body, json]
payloads:
  # A distinctive product (1337*1337 = 1787569) is far less likely to appear by
  # chance than 7*7=49, so a match strongly implies the template engine evaluated it.
  - "{{1337*1337}}"
  - "${1337*1337}"
  - "#{1337*1337}"
  - "<%= 1337*1337 %>"
oracle:
  type: any_of
  checks:
    - type: response_match
      part: body
      patterns: ["1787569"]
confirm_reproducible: true
remediation: >-
  No renderices input del usuario como plantilla. Usa un motor logic-less o un
  sandbox, y pasa los datos del usuario estrictamente como variables de contexto,
  nunca como código de plantilla.
