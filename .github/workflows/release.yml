# Build and publish dastcore to PyPI on a version tag (e.g. `git tag v0.5.0 && git push --tags`),
# generate a CycloneDX SBOM, and attach the wheel/sdist/SBOM to a GitHub Release.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. Configure it once at
# https://pypi.org/manage/project/dastcore/settings/publishing/ with:
#   owner=Proaso17, repo=Dastcore, workflow=release.yml, environment=pypi
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  sbom:
    # A CycloneDX SBOM of the dependencies users actually install (runtime + shipped
    # extras, not dev/test tooling) — supply-chain evidence for enterprise consumers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps + cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install ".[web,api,oast,pg]" cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          python -m cyclonedx_py environment \
            --of JSON --output-reproducible --output-file sbom/dastcore.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Create GitHub Release with dist + SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom/dastcore.cdx.json
          generate_release_notes: true
