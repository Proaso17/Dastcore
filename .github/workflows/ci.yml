# Continuous integration for dastcore itself: lint, type-check, test (with coverage),
# and — because this is a security tool — audit our own dependencies and secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: mypy (type check)
        run: mypy dastcore

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium for headless tests
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: pytest -q

  coverage:
    # Runs the suite once with coverage and enforces the floor (pyproject
    # [tool.coverage.report] fail_under). Kept separate from the test matrix so the
    # instrumentation slowdown doesn't affect the primary correctness signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Chromium for headless tests
        run: python -m playwright install --with-deps chromium
      - name: Test suite with coverage (gate = fail_under)
        run: pytest -q --cov=dastcore --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  audit:
    # A DAST tool must not ship on vulnerable dependencies: audit what we install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,api,oast,pg]" pip-audit
      - name: pip-audit (known-vulnerable dependencies)
        # Skips only the local editable package; still fails on any real advisory.
        run: pip-audit --skip-editable --desc

  secrets:
    # Dogfooding our own message: scan this repo's history for leaked secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  selfscan:
    # Dogfood the shipped CLI against the bundled vulnerable target: fail if it
    # stops detecting the planted high-severity vulns (a detection regression).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dastcore
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Self-scan (dogfooding gate)
        run: python scripts/self_scan.py

  cloud-pg:
    # Exercise the control-plane store against a real PostgreSQL backend, not just the
    # SQLite one — the Postgres-specific claim/requeue paths otherwise only run in prod.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dastcore
          POSTGRES_PASSWORD: dastcore
          POSTGRES_DB: dastcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dastcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DASTCORE_TEST_PG_DSN: postgresql://dastcore:dastcore@localhost:5432/dastcore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with Postgres + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,pg,dev]"
      - name: Run the Postgres-backed store tests
        run: pytest -q tests/test_cloud_pg.py
