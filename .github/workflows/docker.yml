# Build the dastcore container images and publish them to the GitHub Container
# Registry (GHCR). Runs on version tags and on pushes to main (a `:main` tag),
# and builds without pushing on pull requests so the Dockerfiles stay green.
#
# Two images:
#   ghcr.io/<owner>/dastcore        — full scanner (CLI + dashboard + runner)
#   ghcr.io/<owner>/dastcore-cloud  — slim control-plane (API + UI, no browser)
# Pull with, e.g.:  docker pull ghcr.io/proaso17/dastcore:latest
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dastcore
            dockerfile: Dockerfile
          - image: dastcore-cloud
            dockerfile: Dockerfile.cloud
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip login (and push) on pull requests from forks, which lack write access.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
