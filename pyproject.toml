[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dastcore"
dynamic = ["version"]  # single source of truth: dastcore.__version__
description = "Dynamic Application Security Testing (DAST) scanner for web, APIs and LLM/AI chatbots"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dastcore contributors" }]
keywords = [
    "dast",
    "security",
    "pentest",
    "scanner",
    "web-security",
    "api-security",
    "sarif",
    "owasp",
    "llm-security",
    "ai-security",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
    "jinja2>=3.1.3",
    "selectolax>=0.3.17",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
headless = ["playwright>=1.42.0"]
api = ["openapi-core>=0.19.0"]
oast = ["cryptography>=42.0.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "python-multipart>=0.0.9"]
pg = ["psycopg[binary]>=3.1.0"]  # PostgreSQL backend for the cloud control-plane
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "flask>=3.0.0",
    "playwright>=1.42.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Proaso17/Dastcore"
Repository = "https://github.com/Proaso17/Dastcore"
Issues = "https://github.com/Proaso17/Dastcore/issues"

[project.scripts]
dastcore = "dastcore.cli:app"

[tool.setuptools.dynamic]
version = { attr = "dastcore.__version__" }

[tool.setuptools.packages.find]
include = ["dastcore*"]

[tool.setuptools.package-data]
dastcore = ["rules/*.yaml", "ai_rules/*.yaml", "ai_rules/wordlists/*.txt", "report/templates/*.j2", "web/templates/*.j2", "cloud/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["dastcore"]
branch = true
# The demo target and headless crawler need a browser / bundled fixtures that the
# default (non-headless) suite doesn't exercise; measured coverage stays honest.
omit = ["dastcore/discovery/crawler_headless.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# SIM (flake8-simplify) is intentionally excluded: its "return the condition
# directly" / "collapse nested if" suggestions hurt readability in the branchy
# scope/auth/security logic where explicit steps are clearer.
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is handled case by case, not enforced hard
    "B008",   # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
# Pragmatic (not strict) — catches real bugs without a full annotation pass.
disable_error_code = ["union-attr", "arg-type", "assignment", "index", "operator", "attr-defined"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
