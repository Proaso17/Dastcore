[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dastcore"
version = "0.1.0"
description = "Dynamic Application Security Testing (DAST) scanner — dynamic twin of sastcore"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dastcore contributors" }]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
    "jinja2>=3.1.3",
    "selectolax>=0.3.17",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
headless = ["playwright>=1.42.0"]
api = ["openapi-core>=0.19.0"]
oast = ["cryptography>=42.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "flask>=3.0.0",
    "playwright>=1.42.0",
    "cryptography>=42.0.0",
]

[project.scripts]
dastcore = "dastcore.cli:app"

[tool.setuptools.packages.find]
include = ["dastcore*"]

[tool.setuptools.package-data]
dastcore = ["rules/*.yaml", "ai_rules/*.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
