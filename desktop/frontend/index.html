<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dastcore</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; background: #14171c; color: #e6e8eb;
        font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #1a1d21; } }
      .brand { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
      .muted { opacity: .65; font-size: 14px; }
      .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid currentColor; border-top-color: transparent;
        animation: spin .8s linear infinite; opacity: .8;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="brand">dastcore</div>
    <div class="spinner"></div>
    <div class="muted">Iniciando el panel local…</div>
  </body>
</html>
